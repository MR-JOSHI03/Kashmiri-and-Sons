<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leave a review — Kashmiri Sons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#EEF3E7;
    --card:#FFFFFF;
    --ink:#1A2042;
    --muted:#6E7596;
    --line:#D8DFCE;
    --rani:#BE1557;
    --zari:#B38A2E;
    --pad: clamp(18px, 5vw, 28px);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Archivo","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.5;padding-bottom:140px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 var(--pad)}

  /* saree-border motif */
  .border-strip{
    height:13px;
    background:
      repeating-linear-gradient(90deg,
        var(--zari) 0 6px, transparent 6px 13px),
      linear-gradient(var(--rani),var(--rani));
    background-size:13px 3px, 100% 100%;
    background-position:center bottom, 0 0;
    background-repeat:repeat-x, no-repeat;
  }

  header{padding:28px 0 20px}
  .biz{font-size:12.5px;letter-spacing:.15em;color:var(--zari);font-weight:600;margin:0 0 12px}
  h1{
    font-family:"Instrument Serif","Noto Sans Devanagari",serif;font-weight:400;
    font-size:clamp(36px,10.5vw,52px);line-height:1.02;letter-spacing:-.012em;margin:0 0 11px;
  }
  h1 em{font-style:italic;color:var(--rani)}
  .sub{color:var(--muted);margin:0 0 22px;max-width:36ch;font-size:15px}
  .langs{display:flex;gap:7px;margin:0 0 4px}
  .lang{
    flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .lang[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  section{margin:28px 0}
  h2{font-size:17px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
  .hint{color:var(--muted);font-size:13.5px;margin:0 0 13px}
  .req{color:var(--rani);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:10px 15px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;
    transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .chip[aria-pressed="true"]{background:var(--rani);border-color:var(--rani);color:#fff;font-weight:600}
  .chip:disabled{opacity:.36;cursor:default}
  input[type=text]{
    width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font:inherit;font-size:16px;
  }
  input[type=text]::placeholder{color:#9AA2BD}
  :is(button,input,textarea,a):focus-visible{outline:2px solid var(--rani);outline-offset:2px}

  .panel{border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden}
  .panel-top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;border-bottom:1px solid var(--line);
  }
  .panel-top span{font-size:12.5px;font-weight:600;color:var(--muted)}
  .shuffle{
    border:1px solid var(--line);background:var(--bg);color:var(--ink);
    font:inherit;font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;
  }
  textarea{
    width:100%;border:0;background:transparent;color:var(--ink);font:inherit;
    font-size:15.5px;line-height:1.64;padding:16px;resize:none;display:block;min-height:210px;
  }
  textarea:focus{outline:none}
  .fade{animation:in .26s ease}
  @keyframes in{from{opacity:.25}to{opacity:1}}
  .empty{padding:34px 18px;color:var(--muted);font-size:14.5px;text-align:center}

  .photo{
    display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:13px 15px;
    border:1px dashed var(--zari);border-radius:12px;background:rgba(179,138,46,.07);
    font-size:13.5px;color:var(--ink);
  }
  .photo b{font-weight:700}

  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:rgba(238,243,231,.93);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:14px var(--pad);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  }
  .bar-in{max-width:560px;margin:0 auto}
  .cta{
    display:block;width:100%;text-align:center;text-decoration:none;
    padding:17px 16px;border:0;border-radius:13px;cursor:pointer;
    font-family:"Instrument Serif","Noto Sans Devanagari",serif;font-weight:400;
    font-size:21px;color:#fff;background:var(--rani);
  }
  .cta.off{background:#C9D0BF;color:#7E8699;pointer-events:none}
  .bad{display:block;text-align:center;margin:11px 0 0;color:var(--muted);font-size:13px;text-decoration:none}
  .fallback{display:none;text-align:center;margin:10px 0 0;color:var(--rani);font-size:13px;font-weight:600}
  .steps{text-align:center;margin:9px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
  .steps b{color:var(--ink);font-weight:600}
  .lenwrap{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:999px}
  .len{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;
       font-weight:600;padding:5px 13px;border-radius:999px;cursor:pointer}
  .len[aria-pressed="true"]{background:var(--ink);color:#fff}
  .again{display:none;width:100%;margin:0 0 10px;padding:12px;border-radius:12px;
         border:1px solid var(--rani);background:#fff;color:var(--rani);
         font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .again.show{display:block}
  .fallback.show{display:block}
  #clip{position:fixed;top:0;left:-9999px;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
  footer{color:#9AA2BD;font-size:11.5px;text-align:center;padding:2px 0 12px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="border-strip"></div>

      <button class="lang" data-lang="en" type="button">English</button>

      <button class="lang" data-lang="hi" type="button">हिंदी</button>
    </div>
  </header>

  <section>

  </section>

    <p class="hint" id="qNh"></p>

  <section>

      <div class="empty" id="empty"></div>
      <textarea id="out" rows="8" hidden></textarea>
    </div>
    <div class="photo" id="photoTip"></div>
  </section>

  <footer>Sarna Kothi, Bareilly–Nainital Road, Civil Lines, Haldwani</footer>
</div>

<div class="bar">
  <div class="bar-in">
    <button class="again" id="again" type="button"></button>
    <a class="cta off" id="cta" href="#"></a>
    <p class="steps" id="steps"></p>
    <a class="fallback" id="fallback" href="#"></a>
    <a class="bad" id="bad" href="#"></a>
  </div>
</div>
<textarea id="clip" aria-hidden="true" tabindex="-1" readonly></textarea>

/* ---------- state ---------- */
let lang="hx", prods=[], exps=[], city=null, len="short";
const rand = a => a[Math.floor(Math.random()*a.length)];
const $ = id => document.getElementById(id);

function chipGroup(boxId, data, selected, onPick, max){
  const box = $(boxId); box.innerHTML="";
  data.forEach(t=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=t.label[lang];
    const on = Array.isArray(selected) ? selected.includes(t.id) : selected===t.id;
    b.setAttribute("aria-pressed",String(on));
    if(max && Array.isArray(selected)) b.disabled = !on && selected.length>=max;
    b.onclick=()=>onPick(t.id,on);
    box.appendChild(b);
  });
}

function paintChips(){
  chipGroup("prods",PRODUCTS,prods,(id,on)=>{
    prods = on ? prods.filter(x=>x!==id) : [...prods,id]; paintChips(); build();
  },CONFIG.MAX_PRODUCTS);
  chipGroup("exps",EXPERIENCE,exps,(id,on)=>{
    exps = on ? exps.filter(x=>x!==id) : [...exps,id]; paintChips(); build();
  },CONFIG.MAX_EXPERIENCE);
  chipGroup("cities",CITIES,city,(id,on)=>{
    city = on ? null : id; paintChips(); build();
  });
}

function paintUI(){
  const t=UI[lang];
  $("bizName").textContent=CONFIG.BIZ;
  $("hTitle").innerHTML=`${t.t1} <em>${t.t2}</em>`;
  $("hSub").textContent=t.sub;
  $("qP").textContent=t.qP;  $("qPh").innerHTML=t.qPh.replace(/(Required\.|Zaroori hai\.|ज़रूरी है।)/,'<span class="req">$1</span>');
  $("qE").textContent=t.qE;  $("qEh").textContent=t.qEh;
  $("qC").textContent=t.qC;  $("qCh").textContent=t.qCh;
  $("qN").textContent=t.qN;  $("qNh").textContent=t.qNh;
  $("who").placeholder=t.who;
  $("shuffle").textContent=t.shuffle;
  $("steps").innerHTML=t.steps;
  $("again").textContent=t.again;
  document.querySelectorAll(".len").forEach(b=>{
    b.textContent=t[b.dataset.len];
    b.setAttribute("aria-pressed",String(b.dataset.len===len));
  });
  $("empty").textContent=t.empty;
  $("photoTip").innerHTML=t.photo;
  $("bad").textContent=t.bad; $("bad").href=CONFIG.WHATSAPP;
  if(!$("cta").dataset.sent) $("cta").textContent=t.cta;
  document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  document.documentElement.lang = lang==="hi" ? "hi" : "en";
  paintChips();
}

function build(){
  const out=$("out");
  const cta=$("cta");
  if(!prods.length){
    out.hidden=true; $("empty").hidden=false;
    cta.classList.add("off"); cta.href="#"; return;
  }
  $("empty").hidden=true; out.hidden=false;
  cta.classList.remove("off"); cta.href=CONFIG.REVIEW_URL;

  const parts=[ rand(OPEN[lang])(rand(GEO[lang])) ];

  const name=$("who").value.trim();

  if(len==="short"){
    /* Three or four sentences. Short reviews actually get pasted. */
    parts.push(rand(PRODUCTS.find(p=>p.id===prods[0]).lines[lang]));
    if(name) parts.push(rand(STAFF[lang])(name));
    else if(city) parts.push(rand(CITIES.find(c=>c.id===city).lines[lang]));
  }else{
    [...prods].sort(()=>Math.random()-.5).forEach(id=>{
      parts.push(rand(PRODUCTS.find(p=>p.id===id).lines[lang]));
    });
    [...exps].sort(()=>Math.random()-.5).forEach(id=>{
      parts.push(rand(EXPERIENCE.find(e=>e.id===id).lines[lang]));
    });
    if(name) parts.push(rand(STAFF[lang])(name));
    if(city) parts.push(rand(CITIES.find(c=>c.id===city).lines[lang]));
  }
  parts.push(rand(CLOSE[lang]));

  out.value=parts.join(" ");
  out.classList.remove("fade"); void out.offsetWidth; out.classList.add("fade");
}

function source(){
  const h=(location.hash||"").replace(/^#/,"");
  return h || new URLSearchParams(location.search).get("src") || "direct";
}

/* Synchronous copy. Must finish before navigation, so execCommand runs first
   and the async Clipboard API is fired afterwards as a best-effort extra. */
function copyNow(txt){
  const clip=$("clip");
  clip.value=txt;
  clip.readOnly=false;
  let ok=false;
  try{
    if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
      const r=document.createRange(); r.selectNodeContents(clip);
      const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      clip.setSelectionRange(0,txt.length);
    }else{
      clip.focus({preventScroll:true}); clip.select();
    }
    ok=document.execCommand("copy");
  }catch(e){}
  clip.readOnly=true;
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  try{ if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).catch(()=>{}); }catch(e){}
  return ok;
}

function ping(){
  if(!CONFIG.WEBHOOK) return;
  try{
    fetch(CONFIG.WEBHOOK,{method:"POST",mode:"no-cors",keepalive:true,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({src:source(),lang,products:prods,experience:exps,city,at:new Date().toISOString()})
    }).catch(()=>{});
  }catch(e){}
}

/* The CTA is a real <a>, so the browser navigates natively on tap.
   Copy runs synchronously first; nothing is awaited, nothing is delayed. */
$("cta").addEventListener("click",()=>{
  copyNow($("out").value);
  ping();
  const btn=$("cta");
  btn.dataset.sent="1";
  btn.textContent=UI[lang].wait;
  const fb=$("fallback");
  fb.href=CONFIG.FALLBACK_URL;
  fb.textContent=UI[lang].fallback;
  fb.classList.add("show");
  setTimeout(()=>{ btn.textContent=UI[lang].open; },2500);
});

$("shuffle").onclick=build;
$("who").oninput=build;
document.querySelectorAll(".len").forEach(b=>b.onclick=()=>{len=b.dataset.len;paintUI();build();});

/* If they come back without having pasted, offer the clipboard again —
   Android clears it on some launchers when you switch apps. */
$("again").onclick=()=>{ copyNow($("out").value); $("again").classList.remove("show"); };
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && $("cta").dataset.sent) $("again").classList.add("show");
});
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;paintUI();build();});

paintUI(); build();
